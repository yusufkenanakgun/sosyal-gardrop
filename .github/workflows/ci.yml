name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # (Geçici) pnpm store cache KAPALI — önce sorunu çözelim
      # İstersek bu iki adımı sonra yeniden ekleriz.

      # --- Tanılama + Agresif temizlik & izin düzeltme ---
      - name: Diagnose node_modules ownership
        run: |
          set -x
          ls -la apps/mobile || true
          ls -ld apps/mobile/node_modules || true

      - name: Force remove ALL node_modules recursively
        run: |
          set -e
          # Tüm node_modules'ları, .pnpm ve .turbo'yu kökten temizle
          sudo find . -type d -name node_modules -prune -exec rm -rf {} +
          sudo rm -rf .pnpm .turbo
          # Güvenli tarafta kal: mobile tarafını özel olarak da temizle
          sudo rm -rf apps/mobile/node_modules

      - name: Recreate mobile node_modules with correct ownership
        run: |
          sudo install -d -m 0777 apps/mobile/node_modules
          sudo chown -R $USER:$USER apps/mobile
          sudo chmod -R u+rwx apps/mobile

      # --- Kurulum ---
      - name: Install (all)
        run: pnpm install --no-frozen-lockfile

      # --- Turbo cache (açık) ---
      - name: Cache turborepo
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            **/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Prisma (sadece API)
      - name: Prisma generate (@sg/api)
        working-directory: apps/api
        run: pnpm prisma generate

      # ----- Lint -----
      - name: Lint (@sg/api)
        run: pnpm -F @sg/api lint
      - name: Lint (@sg/web)
        run: pnpm -F @sg/web lint
      - name: Lint (@sg/ai)
        run: pnpm -F @sg/ai lint
      - name: Lint (@sg/mobile)
        run: pnpm -F @sg/mobile lint

      # ----- Typecheck -----
      - name: Typecheck (@sg/api)
        run: pnpm -F @sg/api typecheck
      - name: Typecheck (@sg/web)
        run: pnpm -F @sg/web typecheck
      - name: Typecheck (@sg/ai)
        run: pnpm -F @sg/ai typecheck
      - name: Typecheck (@sg/mobile)
        run: pnpm -F @sg/mobile typecheck

      # ----- Build -----
      - name: Build (@sg/api)
        run: pnpm -F @sg/api build
      - name: Build (@sg/web)
        run: pnpm -F @sg/web build
      - name: Build (@sg/ai)
        run: pnpm -F @sg/ai build
