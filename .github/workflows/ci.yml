name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # İstersen ileride mobil değişikliklerinde CI tetiklenmesin diye paths-ignore ekleyebilirsin:
  # push:
  #   paths-ignore: [ "apps/mobile/**" ]
  # pull_request:
  #   paths-ignore: [ "apps/mobile/**" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # pnpm store cache (node_modules cache'lenmez)
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 🔕 Mobil hariç kurulum
      - name: Install (exclude @sg/mobile)
        run: pnpm -r --filter '!@sg/mobile' install --frozen-lockfile

      - name: Cache turborepo
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            **/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Prisma (sadece API) - DATABASE_URL gerekli ama bağlantı yapmıyor
      - name: Prisma generate (@sg/api)
        working-directory: apps/api
        run: pnpm prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_db?schema=public

      # ----- Lint -----
      - name: Lint (@sg/web)
        run: pnpm -F @sg/web lint

      - name: Lint (@sg/api)
        run: pnpm -F @sg/api lint
        continue-on-error: true  # API lint disabled due to type-safety warnings

      - name: Lint (@sg/ai)
        run: pnpm -F @sg/ai lint
        continue-on-error: true  # Optional worker

      # ----- Typecheck -----
      - name: Typecheck (@sg/api)
        run: pnpm -F @sg/api typecheck

      - name: Typecheck (@sg/web)
        run: pnpm -F @sg/web typecheck

      - name: Typecheck (@sg/ai)
        run: pnpm -F @sg/ai typecheck
        continue-on-error: true  # Optional worker

      # ----- Build -----
      # Web build needs a dummy API URL for build time
      - name: Build (@sg/web)
        run: pnpm -F @sg/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Build (@sg/api)
        run: pnpm -F @sg/api build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_db?schema=public
          JWT_SECRET: ci-test-jwt-secret
          ACCESS_TOKEN_TTL: 15m
          REFRESH_TOKEN_TTL: 7d
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: ci-bucket
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_PUBLIC_BASE: http://localhost:9000/ci-bucket

      - name: Build (@sg/ai)
        run: pnpm -F @sg/ai build
        continue-on-error: true  # Optional worker
