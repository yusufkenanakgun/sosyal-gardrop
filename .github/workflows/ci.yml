name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # (İsteğe bağlı) pnpm store cache
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Sadece core paketleri kur (mobile HARİÇ)
      - name: Install (exclude mobile)
        run: pnpm -r --filter '!@sg/mobile' install --frozen-lockfile

      - name: Cache turborepo
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            **/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Prisma (sadece API)
      - name: Prisma generate (@sg/api)
        working-directory: apps/api
        run: pnpm prisma generate

      # ----- Lint -----
      - name: Lint (@sg/api)
        run: pnpm -F @sg/api lint
      - name: Lint (@sg/web)
        run: pnpm -F @sg/web lint
      - name: Lint (@sg/ai)
        run: pnpm -F @sg/ai lint

      # ----- Typecheck -----
      - name: Typecheck (@sg/api)
        run: pnpm -F @sg/api typecheck
      - name: Typecheck (@sg/web)
        run: pnpm -F @sg/web typecheck
      - name: Typecheck (@sg/ai)
        run: pnpm -F @sg/ai typecheck

      # ----- Build -----
      - name: Build (@sg/api)
        run: pnpm -F @sg/api build
      - name: Build (@sg/web)
        run: pnpm -F @sg/web build
      - name: Build (@sg/ai)
        run: pnpm -F @sg/ai build

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'
      # 🔒 En kritik ayar: bin link’leri kapat (pnpm .bin oluşturmaz)
      NPM_CONFIG_BIN_LINKS: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Güvenli temizlik (olası kalıntılar)
      - name: Clean leftovers
        run: |
          sudo rm -rf apps/mobile/node_modules || true
          sudo rm -rf apps/mobile/.pnpm || true
          sudo chown -R $USER:$USER apps/mobile
          sudo chmod -R u+rwX apps/mobile

      # 👉 Mobil bağımlılıkları SADECE mobil dizininde kur:
      # - --ignore-scripts: postinstall/native script’leri atla
      # - bin-links=false: .bin symlink’leri oluşturulmaz -> EACCES biter
      - name: Install (mobile, no bin-links)
        working-directory: apps/mobile
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Lint & Typecheck’i pnpm exec ile çalıştır (bin link’e ihtiyaç yok)
      - name: Typecheck (@sg/mobile)
        working-directory: apps/mobile
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Lint (@sg/mobile)
        working-directory: apps/mobile
        run: pnpm exec eslint . --ext .ts,.tsx
