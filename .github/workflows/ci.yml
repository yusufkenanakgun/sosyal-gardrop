name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # pnpm store cache
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 🧹 Temizlik & izin düzeltme (EACCES fix)
      - name: Force clean and fix permissions
        run: |
          echo "🧹 Cleaning workspace to fix EACCES..."
          sudo rm -rf node_modules **/node_modules .pnpm .turbo
          sudo chown -R $USER:$USER .
          sudo chmod -R u+rwx .

      # 🔓 Kurulum (mobil dahil)
      - name: Install (all)
        run: pnpm install --no-frozen-lockfile

      # Turbo cache
      - name: Cache turborepo
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            **/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Prisma
      - name: Prisma generate (@sg/api)
        working-directory: apps/api
        run: pnpm prisma generate

      # ----- Lint -----
      - name: Lint (@sg/api)
        run: pnpm -F @sg/api lint
      - name: Lint (@sg/web)
        run: pnpm -F @sg/web lint
      - name: Lint (@sg/ai)
        run: pnpm -F @sg/ai lint
      - name: Lint (@sg/mobile)
        run: pnpm -F @sg/mobile lint

      # ----- Typecheck -----
      - name: Typecheck (@sg/api)
        run: pnpm -F @sg/api typecheck
      - name: Typecheck (@sg/web)
        run: pnpm -F @sg/web typecheck
      - name: Typecheck (@sg/ai)
        run: pnpm -F @sg/ai typecheck
      - name: Typecheck (@sg/mobile)
        run: pnpm -F @sg/mobile typecheck

      # ----- Build -----
      - name: Build (@sg/api)
        run: pnpm -F @sg/api build
      - name: Build (@sg/web)
        run: pnpm -F @sg/web build
      - name: Build (@sg/ai)
        run: pnpm -F @sg/ai build
